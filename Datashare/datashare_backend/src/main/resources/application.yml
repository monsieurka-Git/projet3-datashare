spring:
  # Configuration de la base de données PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/datashare
    username: postgres
    password: postgres

  # Configuration JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  sql:
    init:
      mode: always

  # ✅ Configuration obligatoire pour l'upload de fichiers multipart
  servlet:
    multipart:
      enabled: true               # Active le support multipart
      max-file-size: 1024MB       # Taille max d'un fichier : 1 Go (conformité US01)
      max-request-size: 1024MB    # Taille max de la requête totale (1 Go)

security:
  jwt:
    # Secret pour la signature des JWT (minimum 32 caractères)
    secret: "MaCleSuperSecretePourSignerLesTokens12345678901234567890"
    expiration: 3600000
