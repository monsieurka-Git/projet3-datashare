<div class="ds-gradient-bg">
  <app-header-bar></app-header-bar>

  <main class="ds-main">
    <div class="ds-landing-hero">
      <p class="ds-hero-title">Tu veux partager un fichier ?</p>

      <button
        type="button"
        class="ds-cloud-btn"
        (click)="onUploadClick()"
        aria-label="Partager un fichier"
      >
        <span class="ds-cloud-btn__ring"></span>
        <span class="ds-cloud-btn__core">
          <!-- Icône Upload cloud (maquette Figma) -->
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M7 18h10a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.5A3.5 3.5 0 0 0 7 18z"
                  stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 15V9" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M9.5 11.5 12 9l2.5 2.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </button>
    </div>
  </main>

  <footer class="ds-footer">Copyright DataShare® 2025</footer>
</div>
