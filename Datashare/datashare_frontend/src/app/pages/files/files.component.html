<div class="container mt-4">
  <h2>Mes Fichiers</h2>

  <!-- Bloc 1 : Spinner affiché pendant la phase de chargement HTTP -->
  <!-- ✅ role="status" + texte caché pour lecteurs d’écran -->
  <div *ngIf="loading" class="text-center my-4">
    <div class="spinner-border text-primary" role="status" aria-live="polite">
      <span class="visually-hidden">Chargement des fichiers…</span>
    </div>
  </div>

  <!-- Bloc 2 : Message d'erreur -->
  <!-- ✅ role="alert" pour vocalisation immédiate -->
  <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
    {{ errorMessage }}
  </div>

  <!-- Bloc 3 : Aucun fichier -->
  <!-- ✅ role="status" pour message informatif -->
  <div *ngIf="!loading && files.length === 0" class="alert alert-info" role="status">
    Vous n'avez encore téléversé aucun fichier.
  </div>

  <!-- Bloc 4 : Tableau -->
  <!-- ✅ aria-label pour décrire le tableau -->
  <div *ngIf="!loading && files.length > 0" class="table-responsive">
    <table class="table table-striped align-middle" aria-label="Liste de vos fichiers téléversés">
      <thead>
        <tr>
          <th scope="col">Nom du fichier</th>
          <th scope="col">Taille</th>
          <th scope="col">Type</th>
          <th scope="col">Date d'ajout</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let file of files">
          
          <!-- Nom du fichier -->
          <td>
            <strong>{{ file.originalName }}</strong>
          </td>

          <!-- Taille -->
          <td>
            {{ (file.size / 1024).toFixed(1) }} Ko
          </td>

          <!-- Type MIME -->
          <td>
            <span class="badge bg-secondary">{{ file.contentType }}</span>
          </td>

          <!-- Date -->
          <td>
            {{ file.createdAt | date:'dd/MM/yyyy HH:mm' }}
          </td>

          <!-- Actions -->
          <td>
            <!-- Bouton copier lien -->
            <!-- ✅ aria-label pour lecteurs d’écran -->
            <button
              (click)="copyLink(file)"
              class="btn btn-sm btn-outline-primary me-2"
              [disabled]="!file.downloadToken"
              aria-label="Copier le lien de téléchargement pour {{ file.originalName }}"
            >
              {{ copiedFileId === file.id ? 'Lien copié !' : 'Copier le lien' }}
            </button>

            <!-- Bouton supprimer -->
            <!-- ✅ aria-label explicite -->
            <button
              (click)="deleteFile(file.id)"
              class="btn btn-sm btn-outline-danger"
              aria-label="Supprimer le fichier {{ file.originalName }}"
            >
              Supprimer
            </button>
          </td>

        </tr>
      </tbody>
    </table>
  </div>
</div>
