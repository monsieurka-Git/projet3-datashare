<!-- Template racine : contient la navbar et le router-outlet -->

<div class="app-root">
  <!-- Barre de navigation supérieure, visible uniquement pour les pages authentifiées -->
  <ng-container *ngIf="showNavbar">
    <app-navbar></app-navbar>
  </ng-container>

  <!-- Le contenu des pages est injecté ici via le router -->
  <main class="app-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Modale générique (affichée uniquement si isModalVisible est true) -->
  <app-modal
    [visible]="isModalVisible"
    [title]="modalTitle"
    [message]="modalMessage"
    (close)="onModalClose()"
    (confirm)="onModalConfirm()"
  ></app-modal>
</div>
