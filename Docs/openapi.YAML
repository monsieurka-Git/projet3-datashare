openapi: 3.0.3
info:
  title: DataShare API
  version: 1.0.0
  description: API REST pour l'application DataShare. Gestion des utilisateurs et des fichiers.
servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:8080
    description: Local dev

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email

    AuthRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        userId:
          type: string
          format: uuid

    FileDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        size:
          type: integer
          format: int64
        contentType:
          type: string
        downloadLink:
          type: string
        expirationDate:
          type: string
          format: date
        ownerId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        tags:
          type: string
      required:
        - id
        - filename
        - downloadLink

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

paths:
  /api/auth/register:
    post:
      summary: Créer un compte utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '201':
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          description: Requête invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      summary: Authentifier un utilisateur et obtenir un JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Authentification réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/refresh:
    post:
      summary: Renouveler le token JWT
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Nouveau token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Token invalide ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/files/upload:
    post:
      summary: Upload d'un fichier (avec ou sans compte)
      security: []   # upload anonyme possible
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                password:
                  type: string
                tags:
                  type: string
                expirationDate:
                  type: string
                  format: date
      responses:
        '201':
          description: Fichier créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDto'
        '400':
          description: Requête invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Fichier trop volumineux
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/files/{id}:
    get:
      summary: Récupérer les métadonnées d'un fichier ou télécharger via ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Métadonnées du fichier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDto'
        '404':
          description: Fichier introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Accès refusé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/files/download/{downloadLink}:
    get:
      summary: Télécharger un fichier via lien unique
      parameters:
        - name: downloadLink
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Flux binaire du fichier
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Mot de passe requis ou incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Lien invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Fichier expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/files/verify-password:
    post:
      summary: Vérifier le mot de passe d'un fichier protégé
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                downloadLink:
                  type: string
                password:
                  type: string
              required:
                - downloadLink
                - password
      responses:
        '200':
          description: Vérification réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
        '403':
          description: Mot de passe incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/files/user/{userId}:
    get:
      summary: Lister les fichiers d'un utilisateur
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des fichiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileDto'
        '403':
          description: Accès refusé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/files/{id}:
    delete:
      summary: Supprimer un fichier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Supprimé
        '403':
          description: Accès refusé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Fichier introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/files/expired:
    delete:
      summary: Supprimer les fichiers expirés (opération interne / cron)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Nombre de fichiers supprimés
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
